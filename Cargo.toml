[package]
name = "saysion"
version = "0.4.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/salvo-rs/saysion"
documentation = "https://docs.rs/saysion"
description = "Async session support with pluggable stores"
readme = "README.md"
edition = "2024"
rust-version = "1.95"
keywords = []
categories = []
authors = [
  "Yoshua Wuyts <yoshuawuyts@gmail.com>",
  "Jacob Rothstein <hi@jbr.me>",
  "Chris Young <chris@veco.id>"
]

[dependencies]
async-trait = "0.1"
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
anyhow = "1"
blake3 = "1"
async-lock = "3"
time = { version = "0.3.47", features = ["serde"] }
tracing = "0.1"

# Security floors for shared transitive dependencies. Keep these constraints in
# the published manifest: this library intentionally does not track Cargo.lock.
# See docs/dependency-security.md for advisories and feature applicability.
event-listener = { version = "5.4.2", default-features = false }
ctutils = { version = "0.4.4", default-features = false, optional = true }
rustls = { version = "0.23.46", default-features = false, optional = true }
rustls-webpki = { version = "0.103.16", default-features = false, optional = true }
webpki-roots = { version = "1.0.10", default-features = false, optional = true }
tokio = { version = "1.53.3", default-features = false, optional = true }

# Optional backends
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"], optional = true }
mongodb = { version = "3", optional = true }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls"], optional = true }

[features]
default = []
redis = ["dep:redis", "dep:tokio"]
mongodb = ["dep:mongodb", "dep:tokio", "dep:ctutils", "dep:rustls", "dep:rustls-webpki", "dep:webpki-roots"]
sqlx = ["dep:sqlx", "dep:tokio", "dep:rustls", "dep:rustls-webpki", "dep:webpki-roots"]
sqlx-postgres = ["sqlx", "sqlx/postgres"]
sqlx-sqlite = ["sqlx", "sqlx/sqlite"]
sqlx-mysql = ["sqlx", "sqlx/mysql"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time", "sync"] }
