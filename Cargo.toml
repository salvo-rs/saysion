[package]
name = "saysion"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/salvo-rs/saysion"
documentation = "https://docs.rs/saysion"
description = "Async session support with pluggable stores"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
keywords = []
categories = []
authors = [
  "Yoshua Wuyts <yoshuawuyts@gmail.com>",
  "Jacob Rothstein <hi@jbr.me>",
  "chrislearn <chris@acroidea.com>"
]

[dependencies]
async-trait = "0.1.59"
rand = "0.9.2"
base64 = "0.22.1"
sha2 = "0.10.9"
hmac = "0.12.1"
serde = { version = "1.0.150", features = ["derive", "rc"] }
serde_json = "1.0.89"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
anyhow = "1.0.100"
blake3 = "1.8.2"
async-lock = "3.4.2"
time = { version = "0.3.17", features = ["serde"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.36.0", features = ["macros", "rt-multi-thread", "time"] }