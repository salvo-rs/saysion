[package]
name = "saysion"
version = "0.2.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/salvo-rs/saysion"
documentation = "https://docs.rs/saysion"
description = "Async session support with pluggable stores"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
keywords = []
categories = []
authors = [
  "Yoshua Wuyts <yoshuawuyts@gmail.com>",
  "Jacob Rothstein <hi@jbr.me>",
  "chrislearn <chris@acroidea.com>"
]

[dependencies]
async-trait = "0.1"
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
anyhow = "1"
blake3 = "1"
async-lock = "3"
time = { version = "0.3", features = ["serde"] }
tracing = "0.1"

# Optional backends
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"], optional = true }
mongodb = { version = "3", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls"], optional = true }

[features]
default = []
redis = ["dep:redis"]
mongodb = ["dep:mongodb"]
sqlx = ["dep:sqlx"]
sqlx-postgres = ["sqlx", "sqlx/postgres"]
sqlx-sqlite = ["sqlx", "sqlx/sqlite"]
sqlx-mysql = ["sqlx", "sqlx/mysql"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }