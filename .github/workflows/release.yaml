name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version=1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "tag=$TAG crate=$CRATE_VERSION"
          if [ "$TAG" != "$CRATE_VERSION" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $CRATE_VERSION"
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Check all features build
        run: |
          cargo check --features redis
          cargo check --features mongodb
          cargo check --features sqlx-postgres,sqlx-sqlite,sqlx-mysql

      - name: Publish to crates.io
        env:
          CRAGES_TOKEN: ${{ secrets.CRAGES_TOKEN }}
        run: cargo publish --token "$CRAGES_TOKEN"
