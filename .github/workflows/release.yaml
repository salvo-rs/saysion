name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify:
    name: verify release
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_archive: ${{ steps.archive.outputs.data }}
    steps:
      - uses: actions/checkout@v7

      - name: Archive release source
        id: archive
        run: echo "data=$(git archive --format=tar.gz "$GITHUB_SHA" | base64 -w 0)" >> "$GITHUB_OUTPUT"

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml') }}

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version=1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "tag=$TAG crate=$CRATE_VERSION"
          if [ "$TAG" != "$CRATE_VERSION" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $CRATE_VERSION"
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Check all targets and features
        run: cargo check --all-targets --all-features

      - name: Verify release package
        run: cargo package --all-features

  publish:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_ARCHIVE: ${{ needs.verify.outputs.release_archive }}
        run: |
          mkdir release-source
          printf '%s' "$RELEASE_ARCHIVE" | base64 --decode | tar -xz -C release-source
          cd release-source
          cargo +stable publish --no-verify
