name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify:
    name: verify release
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml') }}

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version=1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "tag=$TAG crate=$CRATE_VERSION"
          if [ "$TAG" != "$CRATE_VERSION" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $CRATE_VERSION"
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Reject an already published crate version
        run: python3 scripts/release_preflight.py

      - name: Check release documentation policy
        run: python3 -m unittest discover -s scripts -p 'test_release_*.py'

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test default features
        run: cargo test

      - name: Test all features
        run: cargo test --all-features

      - name: Check all targets and features
        run: cargo check --all-targets --all-features

      - name: Verify release package
        run: cargo package --all-features

      - name: Prepare verified package and lockfile
        id: release_inputs
        run: python3 scripts/release_artifacts.py stage

      - name: Upload verified release inputs
        uses: actions/upload-artifact@v7
        with:
          name: verified-release
          path: ${{ steps.release_inputs.outputs.path }}
          if-no-files-found: error

  publish:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install verified Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Download verified release inputs
        id: release_inputs
        uses: actions/download-artifact@v8
        with:
          name: verified-release
          path: ${{ runner.temp }}/saysion-verified-release

      - name: Restore verified dependency resolution
        run: python3 scripts/release_artifacts.py restore "${{ steps.release_inputs.outputs.download-path }}"

      - name: Rebuild and compare the verified package
        run: |
          cargo package --all-features --locked
          python3 scripts/release_artifacts.py compare "${{ steps.release_inputs.outputs.download-path }}"

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --all-features --locked
